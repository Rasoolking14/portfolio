<!-- Contact Section -->
        <section class="section contact" id="contact">
            <div class="container contact__grid">
                <div class="contact__info">
                    <h2 class="section__title">Contact</h2>
                    <p class="section__lead">Have a project in mind? Get in touch.</p>
                    <ul class="contact__list">
                        <li><i class="fa-solid fa-envelope"></i> <a href="mailto:fredericksrasool11@gmail.com">fredericksrasool11@gmail.com</a></li>
                        <li><i class="fa-solid fa-location-dot"></i> Remote / Worldwide</li>
                        <li><i class="fa-solid fa-phone"></i> 0678020783</li>
                    </ul>
                    <div class="contact__socials">
                        <a href="https://www.linkedin.com/in/rasool-fredericks" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                        <a href="https://github.com/Rasoolking14" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github"></i></a>
                        <a href="https://x.com/" target="_blank" rel="noopener" aria-label="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
                    </div>
                </div>
                <div class="contact__form-wrap">
                    <!-- To receive messages in your inbox, create a free form at https://formspree.io
                         and paste the endpoint (e.g. https://formspree.io/f/xxxxxxx) into data-endpoint below.
                         If left empty, the form falls back to opening the visitor's email client. -->
                    <form class="contact-form" id="contactForm" data-endpoint="" novalidate>
                        <input type="hidden" name="_subject" value="New message from your portfolio">
                        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;height:0;width:0;">
                        <div class="form-row">
                            <label class="form-label" for="name">Name</label>
                            <input class="form-input" type="text" id="name" name="name" autocomplete="name" required>
                        </div>
                        <div class="form-row">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-input" type="email" id="email" name="email" autocomplete="email" required>
                        </div>
                        <div class="form-row">
                            <label class="form-label" for="subject">Subject</label>
                            <input class="form-input" type="text" id="subject" name="subject" required>
                        </div>
                        <div class="form-row">
                            <label class="form-label" for="message">Message</label>
                            <textarea class="form-textarea" id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn--primary btn--full">Send Message</button>
                        <p class="form-status" id="formStatus" aria-live="polite"></p>
                    </form>
                </div>
            </div></section>
